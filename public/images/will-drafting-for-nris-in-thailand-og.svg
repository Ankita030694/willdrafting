    <circle cx="36" cy="35" r="13" fill="none" stroke="#C65378" stroke-width="1.5"/>
    <text x="31" y="40" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#E07090">§</text>

    <!-- Header title -->
    <text x="66" y="32" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#FFFFFF">CROSS-BORDER SUCCESSION PROTOCOL</text>
    <text x="66" y="49" font-family="Arial, sans-serif" font-size="11" fill="#8FA3AD">Thailand Civil Code · Indian Succession Act 1925</text>

    <!-- Jurisdictional Comparison Section -->
    <!-- Thailand Column -->
    <rect x="24" y="90" width="195" height="150" rx="14" fill="#000000" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.1"/>
    <rect x="36" y="102" width="70" height="20" rx="10" fill="#5F7E75" opacity="0.3"/>
    <text x="46" y="116" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#7EABA2">THAILAND</text>
    <text x="36" y="140" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#E5EFF2">Thai CCC Book VI</text>
    <text x="36" y="160" font-family="Arial, sans-serif" font-size="11" fill="#8FA3AD">• 6 Statutory Heir Classes</text>
    <text x="36" y="178" font-family="Arial, sans-serif" font-size="11" fill="#8FA3AD">• Sin Somros Marital Split</text>
    <text x="36" y="196" font-family="Arial, sans-serif" font-size="11" fill="#8FA3AD">• Non-Reciprocating S.44A</text>
    <text x="36" y="214" font-family="Arial, sans-serif" font-size="11" fill="#8FA3AD">• Thai Probate Not Re-Sealed</text>

    <!-- India Column -->
    <rect x="241" y="90" width="195" height="150" rx="14" fill="#000000" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.1"/>
    <rect x="253" y="102" width="55" height="20" rx="10" fill="#C65378" opacity="0.3"/>
    <text x="263" y="116" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#E07090">INDIA</text>
    <text x="253" y="140" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#FFFFFF">ISA 1925 s. 5 &amp; 59</text>
    <text x="253" y="160" font-family="Arial, sans-serif" font-size="11" fill="#8FA3AD">• Strict Lex Situs Rule</text>
    <text x="253" y="178" font-family="Arial, sans-serif" font-size="11" fill="#8FA3AD">• 100% Will Discretion</text>
    <text x="253" y="196" font-family="Arial, sans-serif" font-size="11" fill="#8FA3AD">• Plain A4 Paper (S.63)</text>
    <text x="253" y="214" font-family="Arial, sans-serif" font-size="11" fill="#8FA3AD">• Clean High Court Probate</text>

    <!-- Ring-Fencing Clause Highlight Box -->
    <rect x="24" y="255" width="412" height="115" rx="14" fill="#0D1B22" stroke="#C65378" stroke-width="1" stroke-opacity="0.4"/>
    <text x="40" y="280" font-family="Georgia, serif" font-size="11" font-weight="700" fill="url(#goldGrad)" letter-spacing="1">MANDATORY RING-FENCING CLAUSE</text>
    <text x="40" y="302" font-family="Courier, monospace" font-size="10.5" fill="#CAD8DF">"This Will applies strictly and exclusively</text>
    <text x="40" y="320" font-family="Courier, monospace" font-size="10.5" fill="#CAD8DF">to all my immovable and movable assets situated</text>
    <text x="40" y="338" font-family="Courier, monospace" font-size="10.5" fill="#CAD8DF">in the Republic of India..."</text>
    <text x="40" y="356" font-family="Arial, sans-serif" font-size="9.5" fill="#8FA3AD">* Prevents accidental revocation of Thai testamentary dispositions</text>

    <!-- High Court Verification Badge Bottom -->
    <rect x="24" y="385" width="412" height="55" rx="12" fill="#132228" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.1"/>
    <circle cx="48" cy="412" r="12" fill="#047857" opacity="0.3"/>
    <text x="43" y="416" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#34D399">✓</text>
    <text x="70" y="407" font-family="Arial, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">Verified by High Court Advocates &amp; AMA Legal Solutions</text>
    <text x="70" y="424" font-family="Arial, sans-serif" font-size="10.5" fill="#8FA3AD">Embassy of India Bangkok Consular Compliance Assured</text>
  </g>

  <!-- Bottom Brand Suffix -->
  <text x="72" y="598" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#FFFFFF" opacity="0.9">WillDrafting.in</text>
  <text x="180" y="598" font-family="Arial, sans-serif" font-size="12" fill="#8FA3AD" opacity="0.6">· Powered by AMA Legal Solutions · High Court Advocates</text>
</svg>