    <rect x="0" y="50" width="460" height="20" fill="#C65378" opacity="0.1"/>
    <line x1="0" y1="70" x2="460" y2="70" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.1"/>

    <!-- Seal icon -->
