<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Will Drafting for NRIs in Thailand - AMA Legal Solutions Indian Succession Act Cross-Border Estate Planning">
  <defs>
    <!-- Deep navy background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1B22"/>
      <stop offset="60%" stop-color="#172228"/>
      <stop offset="100%" stop-color="#1E2F38"/>
    </linearGradient>
    <!-- Rose accent gradient -->
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C65378"/>
      <stop offset="100%" stop-color="#E07090"/>
    </linearGradient>
    <!-- Gold accent gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CDAF73"/>
      <stop offset="50%" stop-color="#DFBA75"/>
      <stop offset="100%" stop-color="#F3D39B"/>
    </linearGradient>
    <!-- Card light gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <!-- Clip paths -->
    <clipPath id="mainClip">
      <rect width="1200" height="630" rx="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" clip-path="url(#mainClip)"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="200" cy="120" rx="220" ry="180" fill="#C65378" opacity="0.07" filter="url(#glow)"/>
  <ellipse cx="1050" cy="500" rx="200" ry="160" fill="#5F7E75" opacity="0.08" filter="url(#glow)"/>
  <ellipse cx="900" cy="180" rx="150" ry="120" fill="#C65378" opacity="0.05" filter="url(#glow)"/>

  <!-- Subtle grid pattern overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.3" opacity="0.04"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left vertical accent bar -->
  <rect x="50" y="80" width="4" height="460" rx="2" fill="url(#roseGrad)" opacity="0.9"/>

  <!-- ===== LEFT CONTENT COLUMN ===== -->

  <!-- Badge pill -->
  <rect x="72" y="80" width="370" height="32" rx="16" fill="#C65378" opacity="0.15"/>
  <rect x="72" y="80" width="370" height="32" rx="16" fill="none" stroke="#C65378" stroke-width="1" opacity="0.4"/>
  <circle cx="92" cy="96" r="5" fill="#C65378"/>
  <text x="106" y="101" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#E07090" letter-spacing="1.8">LEGAL SERVICE · NRI SUCCESSION · THAILAND</text>

  <!-- Main headline line 1 -->
  <text x="72" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">Will Drafting for</text>

  <!-- Main headline line 2 with rose accent -->
  <text x="72" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">NRIs in</text>
  <text x="232" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="url(#roseGrad)" letter-spacing="-0.5"> Thailand</text>

  <!-- Main headline line 3 -->
  <text x="72" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="400" fill="#A8B8C0" letter-spacing="-0.3">Bangkok · Pattaya · Phuket · Chiang Mai</text>

  <!-- Divider line -->
  <rect x="72" y="292" width="520" height="1.5" fill="#FFFFFF" opacity="0.12"/>

  <!-- Description text -->
  <text x="72" y="322" font-family="Arial, sans-serif" font-size="14" fill="#8FA3AD" letter-spacing="0.1">Protecting Indian properties, NRE/NRO accounts &amp; commercial estates</text>
  <text x="72" y="342" font-family="Arial, sans-serif" font-size="14" fill="#8FA3AD" letter-spacing="0.1">under Thai CCC Book VI &amp; Indian Succession Act 1925.</text>
  <text x="72" y="362" font-family="Arial, sans-serif" font-size="14" fill="#8FA3AD" letter-spacing="0.1">Ring-fencing Indian soil from foreign probate &amp; spousal disputes.</text>

  <!-- Key stat pills row -->
  <!-- Pill 1: Statute -->
  <rect x="72" y="390" width="180" height="52" rx="12" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.12"/>
  <text x="90" y="412" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#C65378" letter-spacing="1.2">THAI CIVIL CODE</text>
  <text x="90" y="432" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#FFFFFF">Book VI Succession</text>

  <!-- Pill 2: Indian Law -->
  <rect x="264" y="390" width="165" height="52" rx="12" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.12"/>
  <text x="282" y="412" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#C65378" letter-spacing="1.2">GOVERNING LAW</text>
  <text x="282" y="432" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#FFFFFF">ISA 1925 s. 5 &amp; 63</text>

  <!-- Pill 3: Hubs -->
  <rect x="441" y="390" width="175" height="52" rx="12" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.12"/>
  <text x="459" y="412" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#C65378" letter-spacing="1.2">METRO HUBS</text>
  <text x="459" y="432" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#FFFFFF">Bangkok · Sukhumvit</text>

  <!-- Feature check list -->
  <!-- Check 1 -->
  <circle cx="84" cy="476" r="8" fill="#C65378" opacity="0.15"/>
  <text x="78" y="481" font-family="Arial, sans-serif" font-size="12" fill="#C65378" font-weight="700">✓</text>
  <text x="100" y="481" font-family="Arial, sans-serif" font-size="13.5" fill="#B8C8D0">Separate Indian Will Ring-Fences Ancestral Real Estate from Thai Probate</text>

  <!-- Check 2 -->
  <circle cx="84" cy="508" r="8" fill="#C65378" opacity="0.15"/>
  <text x="78" y="513" font-family="Arial, sans-serif" font-size="12" fill="#C65378" font-weight="700">✓</text>
  <text x="100" y="513" font-family="Arial, sans-serif" font-size="13.5" fill="#B8C8D0">Embassy of India Bangkok Consular Attestation &amp; Plain-Paper Signing S.63</text>

  <!-- Check 3 -->
  <circle cx="84" cy="540" r="8" fill="#C65378" opacity="0.15"/>
  <text x="78" y="545" font-family="Arial, sans-serif" font-size="12" fill="#C65378" font-weight="700">✓</text>
  <text x="100" y="545" font-family="Arial, sans-serif" font-size="13.5" fill="#B8C8D0">NRE/NRO Bank Accounts &amp; Demat Portfolios Transmitted Under FEMA Norms</text>

