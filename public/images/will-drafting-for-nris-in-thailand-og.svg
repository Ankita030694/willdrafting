  <g transform="translate(680, 80)">
    <!-- Main glass card container -->
    <rect x="0" y="0" width="460" height="460" rx="24" fill="url(#cardGrad)" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.12" filter="url(#softShadow)"/>

