<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Visual Blueprint: Succession Certificate Court Fee Assessment and Issuance SOP under Indian Succession Act 1925 and State Court Fees Acts">
  <defs>
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0" />
      <stop offset="100%" stop-color="#F4ECE1" />
    </linearGradient>
    <linearGradient id="navyHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#172228" />
      <stop offset="100%" stop-color="#24343D" />
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C65378" />
      <stop offset="100%" stop-color="#9F3B5C" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5F7E75" />
      <stop offset="100%" stop-color="#3D5A52" />
    </linearGradient>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#172228" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="720" rx="20" fill="url(#canvasGrad)" stroke="#172228" stroke-opacity="0.12" stroke-width="2" />

  <!-- Top Banner / Title Header -->
  <g transform="translate(36, 26)">
    <rect width="520" height="26" rx="13" fill="#C65378" fill-opacity="0.12" />
    <text x="260" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#C65378" text-anchor="middle" letter-spacing="1.2">INDIAN SUCCESSION ACT 1925 (PART X) &#x2022; COURT FEES ACT 1870</text>

    <text x="0" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" fill="#172228" letter-spacing="-0.5">Succession Certificate Court Fee Assessment &amp; Issuance SOP</text>
    <text x="0" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#49585F">The 4-stage statutory protocol: Asset valuation, petition under Section 372, ad valorem deposit under Section 379, and grant</text>
  </g>

  <!-- 4 COLUMNS (Width ~264 each, Gap 20, Total ~1128) -->

  <!-- STAGE 1: INTESTATE DEMISE & LOCKED DEBTS -->
  <g transform="translate(36, 126)" filter="url(#cardShadow)">
    <rect width="264" height="530" rx="16" fill="#FFFFFF" stroke="#172228" stroke-opacity="0.1" stroke-width="1.5" />
    <rect width="264" height="42" rx="16" fill="#172228" />
    <rect y="26" width="264" height="16" fill="#172228" />
    <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">1. LOCKED MOVABLE ASSETS</text>

    <!-- Subcard 1.1 -->
    <g transform="translate(14, 54)">
      <rect width="236" height="96" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#172228" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">A</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Debts &amp; Securities Only</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Bank FDs, savings balances, demat shares, mutual funds, PF &amp; insurance.</text>
      <text x="14" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#C65378">&#x25C6; Section 370: No Real Estate</text>
    </g>

    <!-- Subcard 1.2 -->
    <g transform="translate(14, 160)">
      <rect width="236" height="96" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#172228" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">B</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Intestate Trigger</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Arises when deceased leaves NO valid Will or nominee is absent / challenged.</text>
      <text x="14" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#5F7E75">&#x2714; Compels legal heir petition</text>
    </g>

    <!-- Subcard 1.3 -->
    <g transform="translate(14, 266)">
      <rect width="236" height="96" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#172228" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">C</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Market Valuation Date</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Securities valued at petition date market price; bank debts include accrued interest.</text>
      <text x="14" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#172228">&#x2022; Forms ad valorem basis</text>
    </g>

    <!-- Pillar 1 Summary Note -->
    <g transform="translate(14, 372)">
      <rect width="236" height="138" rx="10" fill="#FFF5F7" stroke="#C65378" stroke-opacity="0.2" />
      <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#C65378">STATUTORY NOTICE</text>
      <text x="14" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Under Section 370(1), a court CANNOT grant a succession certificate for immovable property. Land/flats require probate, LOA, or partition.</text>
      <text x="14" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#172228">Jurisdiction: District Judge</text>
    </g>
  </g>

  <!-- STAGE 2: PETITION FILING (SECTION 372) -->
  <g transform="translate(324, 126)" filter="url(#cardShadow)">
    <rect width="264" height="530" rx="16" fill="#FFFFFF" stroke="#172228" stroke-opacity="0.1" stroke-width="1.5" />
    <rect width="264" height="42" rx="16" fill="#172228" />
    <rect y="26" width="264" height="16" fill="#172228" />
    <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">2. DISTRICT COURT PETITION</text>

    <!-- Subcard 2.1 -->
    <g transform="translate(14, 54)">
      <rect width="236" height="96" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#172228" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">A</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Section 372 Petition</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Verified petition stating death date, residence, family tree &amp; debts schedule.</text>
      <text x="14" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#5F7E75">&#x2714; Signed &amp; verified by heir</text>
    </g>

    <!-- Subcard 2.2 -->
    <g transform="translate(14, 160)">
      <rect width="236" height="96" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#172228" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">B</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Jurisdiction Rules</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Filed before District Judge where deceased ordinary resided or where assets exist.</text>
      <text x="14" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#172228">&#x2022; Section 371 ISA 1925</text>
    </g>

    <!-- Subcard 2.3 -->
    <g transform="translate(14, 266)">
      <rect width="236" height="96" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#172228" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">C</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Class I Heirs Notice</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">All legal heirs must be served or provide court NOCs and affidavits of consent.</text>
      <text x="14" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#5F7E75">&#x2714; Eliminates future caveat</text>
    </g>

    <!-- Pillar 2 Summary Note -->
    <g transform="translate(14, 372)">
      <rect width="236" height="138" rx="10" fill="#F4F8FE" stroke="#2452AE" stroke-opacity="0.2" />
      <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#2452AE">MANDATORY DISCLOSURE</text>
      <text x="14" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Petitioner must declare whether any rival Will or probate petition exists. Deliberate concealment is perjury under Section 193 BNS.</text>
      <text x="14" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#172228">Filing Court Fee: Nominal Initial</text>
    </g>
  </g>

  <!-- STAGE 3: AD VALOREM COURT FEE (SECTION 379) -->
  <g transform="translate(612, 126)" filter="url(#cardShadow)">
    <rect width="264" height="530" rx="16" fill="#FFFFFF" stroke="#172228" stroke-opacity="0.1" stroke-width="1.5" />
    <rect width="264" height="42" rx="16" fill="#C65378" />
    <rect y="26" width="264" height="16" fill="#C65378" />
    <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">3. AD VALOREM COURT FEES</text>

    <!-- Subcard 3.1 -->
    <g transform="translate(14, 54)">
      <rect width="236" height="96" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#C65378" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">%</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">State Slab Assessment</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Assessed under Article 12, Schedule I of State Court Fees Act (2% to 7.5%).</text>
      <text x="14" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#C65378">&#x25C6; Section 379(1) ISA Deposit</text>
    </g>

    <!-- Subcard 3.2 -->
    <g transform="translate(14, 160)">
      <rect width="236" height="96" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#172228" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">B</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Statutory Caps by State</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Maharashtra caps at &#x20B9;75,000; Karnataka at &#x20B9;10 Lakhs; Delhi, UP &amp; TN vary.</text>
      <text x="14" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#5F7E75">&#x2714; High estate value protection</text>
    </g>

    <!-- Subcard 3.3 -->
    <g transform="translate(14, 266)">
      <rect width="236" height="96" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#172228" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">C</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Paper Citation (30-45 Days)</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Mandatory notice in English &amp; vernacular newspapers inviting public claims.</text>
      <text x="14" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#172228">&#x2022; Publication: &#x20B9;5,000 - &#x20B9;12,000</text>
    </g>

    <!-- Pillar 3 Summary Note -->
    <g transform="translate(14, 372)">
      <rect width="236" height="138" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.1" />
      <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#172228">PAYMENT TIMELINE</text>
      <text x="14" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Fee is paid via judicial court fee stamps or e-Challan once court pronounces order granting certificate before sealed document release.</text>
      <text x="14" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#C65378">Non-refundable upon grant</text>
    </g>
  </g>

  <!-- STAGE 4: GRANT & THE WILL ALTERNATIVE -->
  <g transform="translate(900, 126)" filter="url(#cardShadow)">
    <rect width="264" height="530" rx="16" fill="#FFFFFF" stroke="#172228" stroke-opacity="0.1" stroke-width="1.5" />
    <rect width="264" height="42" rx="16" fill="#5F7E75" />
    <rect y="26" width="264" height="16" fill="#5F7E75" />
    <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">4. ASSET RELEASE &amp; WILL CTA</text>

    <!-- Subcard 4.1 -->
    <g transform="translate(14, 54)">
      <rect width="236" height="96" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#5F7E75" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">&#x2714;</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Section 381 Indemnity</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Certificate grants full legal indemnity to banks &amp; companies paying the holder.</text>
      <text x="14" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#5F7E75">&#x2714; Absolute statutory discharge</text>
    </g>

    <!-- Subcard 4.2 -->
    <g transform="translate(14, 160)">
      <rect width="236" height="96" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#172228" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">B</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Surety Bond Execution</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Judge orders petitioner to submit surety bond under S.375 to secure third-party claims.</text>
      <text x="14" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#172228">&#x2022; Standard safety condition</text>
    </g>

    <!-- Subcard 4.3: Highlighted Will Alternative Box -->
    <g transform="translate(14, 266)">
      <rect width="236" height="244" rx="10" fill="#172228" />
      <rect x="14" y="14" width="208" height="22" rx="11" fill="#C65378" />
      <text x="118" y="29" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ZERO COURT FEE SOLUTION</text>
      
      <text x="14" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">How a Will Avoids This</text>
      <text x="14" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#FFFFFF" fill-opacity="0.9">A valid Will with named executor entirely eliminates the need for a Succession Certificate.</text>
      
      <text x="14" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#5F7E75">&#x2714; &#x20B9;0 Ad Valorem Court Fee</text>
      <text x="14" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#5F7E75">&#x2714; No 6-Month Court Delays</text>
      <text x="14" y="154" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#5F7E75">&#x2714; Covers Both Land &amp; Securities</text>
      
      <rect x="14" y="174" width="208" height="38" rx="19" fill="#C65378" />
      <text x="118" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">Draft a Will Now &#x2192;</text>
      <text x="118" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle">Takes 15 Mins on WillDrafting.in</text>
    </g>
  </g>

  <!-- Flow Arrows connecting the 4 columns -->
  <g fill="#C65378" stroke="#C65378" stroke-width="1.5">
    <path d="M 304 380 L 316 380 M 312 376 L 316 380 L 312 384" />
    <path d="M 592 380 L 604 380 M 600 376 L 604 380 L 600 384" />
    <path d="M 880 380 L 892 380 M 888 376 L 892 380 L 888 384" />
  </g>

  <!-- Bottom Brand Watermark -->
  <text x="1164" y="694" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#49585F" text-anchor="end">WillDrafting.in &#x2022; Powered by AMA Legal Solutions</text>
</svg>