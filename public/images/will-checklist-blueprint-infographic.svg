<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Visual Blueprint: Indian Will Preparation Checklist and Statutory Documentation Workflow under Indian Succession Act, 1925">
  <defs>
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0" />
      <stop offset="100%" stop-color="#F4ECE1" />
    </linearGradient>
    <linearGradient id="navyHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#172228" />
      <stop offset="100%" stop-color="#24343D" />
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C65378" />
      <stop offset="100%" stop-color="#9F3B5C" />
    </linearGradient>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#172228" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="720" rx="20" fill="url(#canvasGrad)" stroke="#172228" stroke-opacity="0.12" stroke-width="2" />

  <!-- Top Banner / Title Header -->
  <g transform="translate(36, 26)">
    <rect width="430" height="26" rx="13" fill="#C65378" fill-opacity="0.12" />
    <text x="215" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#C65378" text-anchor="middle" letter-spacing="1.2">INDIAN SUCCESSION ACT, 1925 &#x2022; COMPLIANCE BLUEPRINT</text>

    <text x="0" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" fill="#172228" letter-spacing="-0.5">Documents Required for a Legally Valid Will in India</text>
    <text x="0" y="83" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#49585F">The 4-pillar checklist: Testator proof, asset ownership documents, legal appointments, and Section 63 witness attestation</text>
  </g>

  <!-- 4 COLUMNS: 4 PILLARS (Width ~264 each, Gap 20, Total ~1128) -->

  <!-- PILLAR 1: TESTATOR IDENTITY & FITNESS -->
  <g transform="translate(36, 126)" filter="url(#cardShadow)">
    <rect width="264" height="530" rx="16" fill="#FFFFFF" stroke="#172228" stroke-opacity="0.1" stroke-width="1.5" />
    <rect width="264" height="42" rx="16" fill="#172228" />
    <rect y="26" width="264" height="16" fill="#172228" />
    <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">1. TESTATOR PROOFS</text>

    <!-- Step 1.1 -->
    <g transform="translate(14, 54)">
      <rect width="236" height="100" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#172228" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">A</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Government ID &amp; PAN</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Aadhaar card (address proof), PAN card (tax identity), Voter ID or Passport.</text>
      <text x="14" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#5F7E75">&#x2714; Prevents identity disputes</text>
    </g>

    <!-- Step 1.2 -->
    <g transform="translate(14, 166)">
      <rect width="236" height="110" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#172228" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">B</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Doctor's Fitness Cert.</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">MBBS/MD doctor certificate confirming sound mental disposing capacity (Section 59).</text>
      <text x="14" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#C65378">&#x26A0; Critical for seniors (60+)</text>
    </g>

    <!-- Step 1.3 -->
    <g transform="translate(14, 288)">
      <rect width="236" height="110" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#172228" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">C</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Proof of Full Capacity</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Clear declaration in Will: executed voluntarily without coercion, fraud, or intoxication.</text>
      <text x="14" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#5F7E75">&#x2714; Free volition verified</text>
    </g>

    <!-- Pillar 1 Summary Badge -->
    <g transform="translate(14, 410)">
      <rect width="236" height="98" rx="8" fill="#172228" fill-opacity="0.04" stroke="#172228" stroke-opacity="0.1" />
      <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#172228" letter-spacing="0.5">STATUTORY AUTHORITY</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#55636D">Section 59 Indian Succession Act: Only person of sound mind can dispose estate by Will.</text>
    </g>
  </g>

  <!-- PILLAR 2: IMMOVABLE PROPERTY PAPERS -->
  <g transform="translate(324, 126)" filter="url(#cardShadow)">
    <rect width="264" height="530" rx="16" fill="#FFFFFF" stroke="#172228" stroke-opacity="0.1" stroke-width="1.5" />
    <rect width="264" height="42" rx="16" fill="#172228" />
    <rect y="26" width="264" height="16" fill="#172228" />
    <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">2. PROPERTY PAPERS</text>

    <!-- Step 2.1 -->
    <g transform="translate(14, 54)">
      <rect width="236" height="100" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#172228" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">A</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Registered Title Deed</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Sale Deed, Gift Deed, Conveyance, or Partition Deed proving complete clear ownership.</text>
      <text x="14" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#5F7E75">&#x2714; Self-acquired title proof</text>
    </g>

    <!-- Step 2.2 -->
    <g transform="translate(14, 166)">
      <rect width="236" height="110" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#172228" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">B</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Revenue &amp; Tax Records</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Khata / Patta extract, latest property tax receipt, Encumbrance Certificate (EC 13/30 yrs).</text>
      <text x="14" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#5F7E75">&#x2714; Verifies non-encumbrance</text>
    </g>

    <!-- Step 2.3 -->
    <g transform="translate(14, 288)">
      <rect width="236" height="110" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#172228" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">C</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Plot &amp; Boundary Details</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Survey numbers, CTS number, carpet area, North/South/East/West four-side boundaries.</text>
      <text x="14" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#C65378">&#x26A0; Required for mutation</text>
    </g>

    <!-- Pillar 2 Summary Badge -->
    <g transform="translate(14, 410)">
      <rect width="236" height="98" rx="8" fill="#172228" fill-opacity="0.04" stroke="#172228" stroke-opacity="0.1" />
      <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#172228" letter-spacing="0.5">ANCESTRAL PROPERTY</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#55636D">Testator can only bequeath undivided coparcenary share (Sec 30 HSA), not entire joint ancestral land.</text>
    </g>
  </g>

  <!-- PILLAR 3: FINANCIAL & MOVABLE ASSETS -->
  <g transform="translate(612, 126)" filter="url(#cardShadow)">
    <rect width="264" height="530" rx="16" fill="#FFFFFF" stroke="#172228" stroke-opacity="0.1" stroke-width="1.5" />
    <rect width="264" height="42" rx="16" fill="#172228" />
    <rect y="26" width="264" height="16" fill="#172228" />
    <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">3. FINANCIAL ASSETS</text>

    <!-- Step 3.1 -->
    <g transform="translate(14, 54)">
      <rect width="236" height="100" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#172228" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">A</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Bank &amp; Fixed Deposits</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Passbook first page, FDRs, Bank branch name, IFSC code, Account numbers, and CIF ID.</text>
      <text x="14" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#5F7E75">&#x2714; Overrides nominee disputes</text>
    </g>

    <!-- Step 3.2 -->
    <g transform="translate(14, 166)">
      <rect width="236" height="110" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#172228" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">B</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Demat &amp; Mutual Funds</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Client Master Report (CMR) from broker, NSDL/CDSL 16-digit Demat ID, CAMS CAS folios.</text>
      <text x="14" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#5F7E75">&#x2714; Seamless SEBI transmission</text>
    </g>

    <!-- Step 3.3 -->
    <g transform="translate(14, 288)">
      <rect width="236" height="110" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#172228" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">C</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Insurance, PPF &amp; Gold</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Policy bond numbers, PPF account book, Locker number, Gold valuation / weight vouchers.</text>
      <text x="14" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#5F7E75">&#x2714; Prevents locker freezing</text>
    </g>

    <!-- Pillar 3 Summary Badge -->
    <g transform="translate(14, 410)">
      <rect width="236" height="98" rx="8" fill="#172228" fill-opacity="0.04" stroke="#172228" stroke-opacity="0.1" />
      <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#172228" letter-spacing="0.5">SUPREME COURT PRECEDENT</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#55636D">Shakti Yezdani (2023): Nominees are merely temporary trustees. Only Will beneficiaries get real ownership.</text>
    </g>
  </g>

  <!-- PILLAR 4: APPOINTMENTS & EXECUTION -->
  <g transform="translate(900, 126)" filter="url(#cardShadow)">
    <rect width="264" height="530" rx="16" fill="#FFFFFF" stroke="#172228" stroke-opacity="0.1" stroke-width="1.5" />
    <rect width="264" height="42" rx="16" fill="#172228" />
    <rect y="26" width="264" height="16" fill="#172228" />
    <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">4. EXECUTION RULES</text>

    <!-- Step 4.1 -->
    <g transform="translate(14, 54)">
      <rect width="236" height="100" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#172228" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">A</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Primary &amp; Alt Executor</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Name trusted individual to administer estate under Sec 211. Name alternate if primary fails.</text>
      <text x="14" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#5F7E75">&#x2714; Avoids court delay</text>
    </g>

    <!-- Step 4.2 -->
    <g transform="translate(14, 166)">
      <rect width="236" height="110" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#172228" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">B</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Two Attesting Witnesses</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Two adult witnesses must see testator sign &amp; sign together (Sec 63). They must NOT be heirs.</text>
      <text x="14" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#C65378">&#x26A0; Sec 67: Bequest void to witness</text>
    </g>

    <!-- Step 4.3 -->
    <g transform="translate(14, 288)">
      <rect width="236" height="110" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="20" cy="20" r="10" fill="#172228" />
      <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">C</text>
      <text x="36" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#172228">Residual Clause &amp; Custody</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#49585F">Sweeps unlisted, future assets. Plain paper is 100% legal; SRO registration is optional.</text>
      <text x="14" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#5F7E75">&#x2714; Zero asset omission risk</text>
    </g>

    <!-- Pillar 4 Summary Badge -->
    <g transform="translate(14, 410)">
      <rect width="236" height="98" rx="8" fill="#172228" fill-opacity="0.04" stroke="#172228" stroke-opacity="0.1" />
      <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#172228" letter-spacing="0.5">ZERO STAMP DUTY</text>
      <text x="14" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#55636D">No stamp paper needed under Indian Stamp Act, 1899. Plain white A4 paper signed by 2 witnesses is legally valid.</text>
    </g>
  </g>

  <!-- Watermark / Footer Brand -->
  <g transform="translate(940, 686)">
    <text x="220" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#172228" text-anchor="end" opacity="0.6">WillDrafting.in &#x2022; AMA Legal Solutions</text>
  </g>
</svg>
