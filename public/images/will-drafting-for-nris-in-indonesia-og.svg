  <text x="79" y="457" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#E07090">&#10003;</text>
  <text x="104" y="457" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">FEMA $1M Repatriation</text>
  <text x="290" y="457" font-family="Arial, sans-serif" font-size="14" fill="#8FA4B0">— Form 15CA/15CB NRO capital transfer</text>

