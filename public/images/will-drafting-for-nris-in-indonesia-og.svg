  <text x="104" y="373" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Section 63 Plain-Paper Signing</text>
  <text x="345" y="373" font-family="Arial, sans-serif" font-size="14" fill="#8FA4B0">— 2 witnesses, no Indian stamp duty</text>

  <!-- Item 3 -->
