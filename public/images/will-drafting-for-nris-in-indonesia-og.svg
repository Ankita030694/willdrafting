    <text x="40" y="206" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#E07090" letter-spacing="0.5">LEGAL SAFEGUARD ARCHITECTURE</text>

    <text x="40" y="232" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">&#8226; Burgerlijk Wetboek Forced Heirship</text>
    <text x="52" y="248" font-family="Arial, sans-serif" font-size="11" fill="#8FA4B0">Isolates legitieme portie under BW Book II</text>

    <text x="40" y="272" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">&#8226; Foreign Ring-Fencing Language</text>
    <text x="52" y="288" font-family="Arial, sans-serif" font-size="11" fill="#8FA4B0">Dual-will protects Hak Pakai &amp; Indian land</text>

    <text x="40" y="312" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">&#8226; Plain-Paper Signing in Jakarta/Medan</text>

    <!-- Brand stamp footer -->
    <rect x="24" y="346" width="402" height="96" rx="12" fill="#C65378" fill-opacity="0.08" stroke="#C65378" stroke-opacity="0.25" stroke-width="1"/>
    <text x="40" y="374" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#FFFFFF">WillDrafting.in · AMA Legal Solutions</text>
    <text x="40" y="394" font-family="Arial, sans-serif" font-size="12" fill="#A8B8C0">Bar Council Advocates · High Court of Delhi Practice</text>
    <text x="40" y="412" font-family="Arial, sans-serif" font-size="11" fill="#E07090">Cross-Border Succession &amp; NRI Estate Advisory</text>
    <text x="40" y="428" font-family="Arial, sans-serif" font-size="10" fill="#6A808C">www.willdrafting.in/services/will-drafting-for-nris-in-indonesia</text>
