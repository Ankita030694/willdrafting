  <text x="79" y="415" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#E07090">&#10003;</text>
  <text x="104" y="415" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Consulate &amp; Apostille Support</text>
  <text x="330" y="415" font-family="Arial, sans-serif" font-size="14" fill="#8FA4B0">— Jakarta, Medan &amp; Bali consular seals</text>

