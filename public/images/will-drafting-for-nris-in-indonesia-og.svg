    <text x="247" y="116" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#FFFFFF">100% Free</text>
    <text x="247" y="136" font-family="Arial, sans-serif" font-size="11" fill="#A8B8C0">Will Freedom on Self-Acquired</text>
    <text x="247" y="152" font-family="Arial, sans-serif" font-size="10" fill="#E07090">Section 59 Testamentary Will</text>

    <!-- Legal comparison block -->
