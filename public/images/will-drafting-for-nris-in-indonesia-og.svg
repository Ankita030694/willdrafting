<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Will Drafting for NRIs in Indonesia - AMA Legal Solutions Indian Succession Act Cross-Border Estate Planning">
  <defs>
    <!-- Deep navy background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1B22"/>
      <stop offset="60%" stop-color="#172228"/>
      <stop offset="100%" stop-color="#1E2F38"/>
    </linearGradient>
    <!-- Rose accent gradient -->
    <linearGradient id="roseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C65378"/>
      <stop offset="100%" stop-color="#E07090"/>
    </linearGradient>
    <!-- Card light gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <!-- Clip paths -->
    <clipPath id="mainClip">
      <rect width="1200" height="630" rx="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" clip-path="url(#mainClip)"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="200" cy="120" rx="220" ry="180" fill="#C65378" opacity="0.07" filter="url(#glow)"/>
