<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Visual Blueprint: Anatomy of an Enforceable Indian Will under Section 63 of Indian Succession Act">
  <defs>
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0" />
      <stop offset="100%" stop-color="#F3ECE1" />
    </linearGradient>
    <linearGradient id="navyHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#172228" />
      <stop offset="100%" stop-color="#24343D" />
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C65378" />
      <stop offset="100%" stop-color="#9F3B5C" />
    </linearGradient>
    <filter id="softShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#172228" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="700" rx="20" fill="url(#canvasGrad)" stroke="#172228" stroke-opacity="0.12" stroke-width="2" />

  <!-- Top Banner -->
  <g transform="translate(32, 28)">
    <rect width="360" height="26" rx="13" fill="#C65378" fill-opacity="0.12" />
    <text x="180" y="17" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" font-weight="800" fill="#C65378" text-anchor="middle" letter-spacing="1.2">STATUTORY BLUEPRINT &#x2022; SECTION 63 COMPLIANCE</text>

    <text x="0" y="60" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="26" font-weight="800" fill="#172228" letter-spacing="-0.5">Anatomy of an Enforceable Will in India</text>
    <text x="0" y="86" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13.5" font-weight="500" fill="#49585F">The 8 mandatory statutory clauses required for clean mutation, bank asset transmission, and probate court validity</text>
  </g>

  <!-- COLUMN 1: CLAUSES 1 TO 4 (Left Column, Width 550) -->
  <g transform="translate(32, 134)" filter="url(#softShadow)">
    <rect width="554" height="480" rx="16" fill="#FFFFFF" stroke="#172228" stroke-opacity="0.1" stroke-width="1.5" />
    <rect width="554" height="42" rx="16" fill="#172228" />
    <rect y="26" width="554" height="16" fill="#172228" />
    <text x="24" y="27" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.8">PART A: TESTAMENTARY CAPACITY &amp; ASSET SCHEDULES</text>

    <!-- Clause 1 -->
    <g transform="translate(18, 56)">
      <rect width="518" height="92" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="24" cy="24" r="12" fill="#172228" />
      <text x="24" y="28" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
      <text x="44" y="24" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#172228">Declaration of Sound Mind &amp; Volition</text>
      <rect x="360" y="12" width="144" height="20" rx="6" fill="#C65378" fill-opacity="0.1" />
      <text x="432" y="26" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" font-weight="700" fill="#C65378" text-anchor="middle">Section 59, ISA 1925</text>
      <text x="44" y="48" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11.5" fill="#49585F">Declares age (18+), sound disposing mind, memory, and understanding.</text>
      <text x="44" y="66" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" font-weight="600" fill="#5F7E75">Defends against future claims of dementia, fraud, coercion, or undue influence.</text>
    </g>

    <!-- Clause 2 -->
    <g transform="translate(18, 158)">
      <rect width="518" height="92" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="24" cy="24" r="12" fill="#172228" />
      <text x="24" y="28" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
      <text x="44" y="24" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#172228">Revocation of All Prior Wills &amp; Codicils</text>
      <rect x="360" y="12" width="144" height="20" rx="6" fill="#C65378" fill-opacity="0.1" />
      <text x="432" y="26" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" font-weight="700" fill="#C65378" text-anchor="middle">Section 62, ISA 1925</text>
      <text x="44" y="48" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11.5" fill="#49585F">Explicitly revokes past informal writings, registered wills, or codicils.</text>
      <text x="44" y="66" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" font-weight="600" fill="#5F7E75">Ensures only the latest will governs; for NRIs, territorial scope prevents cross-revocation.</text>
    </g>

    <!-- Clause 3 -->
    <g transform="translate(18, 260)">
      <rect width="518" height="92" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="24" cy="24" r="12" fill="#172228" />
      <text x="24" y="28" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="44" y="24" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#172228">Appointment of Executor &amp; Alternate</text>
      <rect x="360" y="12" width="144" height="20" rx="6" fill="#C65378" fill-opacity="0.1" />
      <text x="432" y="26" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" font-weight="700" fill="#C65378" text-anchor="middle">Section 222, ISA 1925</text>
      <text x="44" y="48" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11.5" fill="#49585F">Names primary fiduciary and alternate to distribute assets and apply for probate.</text>
      <text x="44" y="66" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" font-weight="600" fill="#5F7E75">Probate under Indian law is granted ONLY to an executor named in the will.</text>
    </g>

    <!-- Clause 4 -->
    <g transform="translate(18, 362)">
      <rect width="518" height="98" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="24" cy="24" r="12" fill="#172228" />
      <text x="24" y="28" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
      <text x="44" y="24" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#172228">Schedules of Immovable &amp; Movable Assets</text>
      <rect x="360" y="12" width="144" height="20" rx="6" fill="#C65378" fill-opacity="0.1" />
      <text x="432" y="26" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" font-weight="700" fill="#C65378" text-anchor="middle">Schedule A &amp; B</text>
      <text x="44" y="48" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11.5" fill="#49585F">Detailed breakdown: survey numbers, municipal ward, Demat folios, bank accounts.</text>
      <text x="44" y="66" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" font-weight="600" fill="#5F7E75">Prevents ambiguity; enables direct title mutation and bank account transmissions.</text>
    </g>
  </g>

  <!-- COLUMN 2: CLAUSES 5 TO 8 (Right Column, Width 550) -->
  <g transform="translate(614, 134)" filter="url(#softShadow)">
    <rect width="554" height="480" rx="16" fill="#FFFFFF" stroke="#172228" stroke-opacity="0.1" stroke-width="1.5" />
    <rect width="554" height="42" rx="16" fill="#172228" />
    <rect y="26" width="554" height="16" fill="#172228" />
    <text x="24" y="27" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.8">PART B: SAFETY NETS, SIGNATURE &amp; WITNESS RULES</text>

    <!-- Clause 5 -->
    <g transform="translate(18, 56)">
      <rect width="518" height="92" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="24" cy="24" r="12" fill="#172228" />
      <text x="24" y="28" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text>
      <text x="44" y="24" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#172228">The Residuary Clause (Sweeper Provision)</text>
      <rect x="360" y="12" width="144" height="20" rx="6" fill="#C65378" fill-opacity="0.1" />
      <text x="432" y="26" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" font-weight="700" fill="#C65378" text-anchor="middle">Section 102, ISA 1925</text>
      <text x="44" y="48" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11.5" fill="#49585F">Bequeaths all future properties acquired after execution, plus unlisted funds.</text>
      <text x="44" y="66" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" font-weight="600" fill="#5F7E75">Essential: Eliminates partial intestacy so unlisted assets never go to court dispute.</text>
    </g>

    <!-- Clause 6 -->
    <g transform="translate(18, 158)">
      <rect width="518" height="92" rx="10" fill="#FAF7F0" stroke="#172228" stroke-opacity="0.08" />
      <circle cx="24" cy="24" r="12" fill="#172228" />
      <text x="24" y="28" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">6</text>
      <text x="44" y="24" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#172228">Nomination Override Declaration</text>
      <rect x="360" y="12" width="144" height="20" rx="6" fill="#C65378" fill-opacity="0.1" />
      <text x="432" y="26" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" font-weight="700" fill="#C65378" text-anchor="middle">Supreme Court 2023</text>
      <text x="44" y="48" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11.5" fill="#49585F">Affirms that bank &amp; mutual fund nominees are custodians (Shakti Yezdani rule).</text>
      <text x="44" y="66" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" font-weight="600" fill="#5F7E75">Ensures the Will's beneficial heir supersedes bank nomination records permanently.</text>
    </g>

    <!-- Clause 7 -->
    <g transform="translate(18, 260)">
      <rect width="518" height="92" rx="10" fill="#ECFDF5" stroke="#059669" stroke-opacity="0.3" stroke-width="1.5" />
      <circle cx="24" cy="24" r="12" fill="#059669" />
      <text x="24" y="28" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">7</text>
      <text x="44" y="24" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#065F46">Two Independent Attesting Witnesses</text>
      <rect x="360" y="12" width="144" height="20" rx="6" fill="#059669" fill-opacity="0.15" />
      <text x="432" y="26" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" font-weight="700" fill="#065F46" text-anchor="middle">Section 63(c), ISA 1925</text>
      <text x="44" y="48" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11.5" fill="#064E3B">Minimum two adult witnesses must watch the testator sign and sign in their presence.</text>
      <text x="44" y="66" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">Plain paper signature valid across India &#x2022; Zero stamp duty required.</text>
    </g>

    <!-- Clause 8: Warning Callout -->
    <g transform="translate(18, 362)">
      <rect width="518" height="98" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-opacity="0.35" stroke-width="1.5" />
      <circle cx="24" cy="24" r="12" fill="#DC2626" />
      <text x="24" y="28" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text>
      <text x="44" y="24" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#991B1B">CRITICAL WARNING: Section 67 Disqualification</text>
      <rect x="360" y="12" width="144" height="20" rx="6" fill="#EF4444" fill-opacity="0.15" />
      <text x="432" y="26" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="10" font-weight="700" fill="#B91C1C" text-anchor="middle">Section 67, ISA 1925</text>
      <text x="44" y="48" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#B91C1C">Beneficiaries or their spouses CANNOT sign as attesting witnesses.</text>
      <text x="44" y="66" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11" fill="#7F1D1D">Signing voids their bequest completely by law. Always choose neutral friends or doctor.</text>
    </g>
  </g>

  <!-- Bottom Strip: 3 Trust Badges -->
  <g transform="translate(32, 634)">
    <rect width="1136" height="42" rx="10" fill="#FFFFFF" stroke="#172228" stroke-opacity="0.08" />
    <g transform="translate(24, 25)">
      <circle cx="0" cy="0" r="4" fill="#059669" />
      <text x="12" y="4" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#172228">100% Plain Paper Legal &#x2022; ₹0 Stamp Duty (Indian Stamp Act 1899)</text>
    </g>
    <g transform="translate(440, 25)">
      <circle cx="0" cy="0" r="4" fill="#C65378" />
      <text x="12" y="4" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#172228">Optional Registration &#x2022; Valid with or without Sub-Registrar</text>
    </g>
    <g transform="translate(860, 25)">
      <circle cx="0" cy="0" r="4" fill="#172228" />
      <text x="12" y="4" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#172228">Audited by AMA Legal Solutions</text>
    </g>
  </g>
</svg>
